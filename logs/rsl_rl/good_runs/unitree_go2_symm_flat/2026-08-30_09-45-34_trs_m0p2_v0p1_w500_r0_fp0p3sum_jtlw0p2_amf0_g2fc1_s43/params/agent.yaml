seed: 43
device: cuda:0
num_steps_per_env: 24
max_iterations: 20000
empirical_normalization: {}
obs_groups:
  actor:
  - policy
  critic:
  - policy
clip_actions: null
check_for_nan: true
save_interval: 1000
experiment_name: unitree_go2_symm_flat
run_name: d8_go2_d5base_trs_m0p2_v0p1_w500_r0_fp0p3sum_jtlw0p2_amf0_g2fc1_s43
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
class_name: OnPolicyRunner
actor:
  class_name: MLPModel
  hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: false
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 0.5
    std_type: scalar
critic:
  class_name: MLPModel
  hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: false
  distribution_cfg: null
algorithm:
  class_name: isaaclab_tasks.manager_based.locomotion.velocity.config.symm_quadruped.time_reversal_ppo:TimeReversalPPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.005
  desired_kl: 0.01
  max_grad_norm: 1.0
  optimizer: adam
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  share_cnn_encoders: false
  rnd_cfg: null
  symmetry_cfg:
    use_data_augmentation: false
    use_mirror_loss: true
    data_augmentation_func: isaaclab_tasks.manager_based.locomotion.velocity.mdp.symm_quadruped:compute_time_reversal_states
    mirror_loss_coeff: 0.2
    use_time_reversal_regularization: true
    value_loss_coeff: 0.1
    min_abs_command_velocity: 0.0
    warmup_iterations: 500
    rampup_iterations: 0
    ramp_shape: linear
    command_observation_index: 9
    command_observation_scale: 2.0
    use_tr_policy_consistency: null
    use_tr_value_consistency: null
    log_disabled_raw_consistency: false
    tr_policy_output_space: normalized_requested_joint_target
    actor_mean_bound_mode: per_joint_feasible
    actor_mean_feasible_margin_fraction: 0.0
    tr_policy_schedule:
      enabled: null
      target_coeff: null
      warmup_iterations: null
      rampup_iterations: null
      hold_iterations: 0
      decay_iterations: 0
      final_scale: 1.0
      ramp_shape: null
    tr_value_schedule:
      enabled: null
      target_coeff: null
      warmup_iterations: null
      rampup_iterations: null
      hold_iterations: 0
      decay_iterations: 0
      final_scale: 1.0
      ramp_shape: null
    tr_validity:
      mode: command
      min_abs_command_velocity: null
      tracking_abs_tolerance: 0.25
      tracking_rel_tolerance: 0.25
      projected_gravity_tolerance: 0.35
      phase_boundary_margin: 0.03
      command_speed_bin_edges: !!python/tuple
      - 0.5
      - 1.0
      - 1.5
    tr_gradient_diagnostics:
      enabled: false
      interval: 100
      epsilon: 1.0e-12
    tr_augmentation:
      enabled: false
      mode: dynamics_filtered_reverse_action_supervision
      action_source: analytic
      coefficient: 0.0
      schedule:
        enabled: null
        target_coeff: null
        warmup_iterations: null
        rampup_iterations: null
        hold_iterations: 0
        decay_iterations: 0
        final_scale: 1.0
        ramp_shape: null
      dynamics_hidden_dims: !!python/tuple
      - 256
      - 256
      inverse_hidden_dims: !!python/tuple
      - 256
      - 256
      learning_rate: 0.001
      ema_decay: 0.995
      validation_fraction: 0.2
      validation_quantile: 0.95
      threshold_multiplier: 2.0
      minimum_validation_samples: 128
      maximum_validation_loss: 1.0
      filter_enabled: true
      phase_boundary_margin: 0.03
      maximum_contact_impulse: 20.0
      action_abs_limit: 10.0
      max_augmented_to_original_ratio: 0.25
      use_confidence_weights: true
      model_updates_per_rollout: 1
      model_batch_size: 4096
      gradient_diagnostics_interval: 100
      gradient_diagnostics_epsilon: 1.0e-12
      rng_seed: 0
policy: {}
