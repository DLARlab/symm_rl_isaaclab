<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 780" width="1600" height="780" role="img" aria-labelledby="balance-title balance-description"><title id="balance-title">Dobot X1 fixed-grid front and hind load allocation by direction</title><desc id="balance-description">Grouped bars show family-balanced signed front-hind imbalance over three speeds and ten gaits.</desc><rect width="1600" height="780" fill="#FFFFFF" /><text x="800.00" y="43.00" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="600" text-anchor="middle" fill="#202124">Dobot X1: front/hind load allocation in fixed gait-speed grid</text><text x="800.00" y="72.00" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="middle" fill="#5F6368">Signed imbalance = 100 × (front − hind) / (front + hind); equal-family mean; zero is equal usage</text><text x="442.50" y="112.00" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="600" text-anchor="middle" fill="#202124">Backward grid: −0.5, −1.0, −1.5 m/s</text><line x1="105.00" x2="780.00" y1="605.00" y2="605.00" stroke="#E2E5E9" stroke-width="1" /><text x="94.00" y="610.00" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="end" fill="#5F6368">-100</text><line x1="105.00" x2="780.00" y1="487.50" y2="487.50" stroke="#E2E5E9" stroke-width="1" /><text x="94.00" y="492.50" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="end" fill="#5F6368">-50</text><line x1="105.00" x2="780.00" y1="370.00" y2="370.00" stroke="#9AA0A6" stroke-width="1.5" /><text x="94.00" y="375.00" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="end" fill="#5F6368">+0</text><line x1="105.00" x2="780.00" y1="252.50" y2="252.50" stroke="#E2E5E9" stroke-width="1" /><text x="94.00" y="257.50" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="end" fill="#5F6368">+50