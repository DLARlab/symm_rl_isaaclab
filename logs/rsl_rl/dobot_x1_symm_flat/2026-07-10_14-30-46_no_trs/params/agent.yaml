seed: 42
device: cuda:0
num_steps_per_env: 24
max_iterations: 10000
empirical_normalization: {}
obs_groups:
  actor:
  - policy
  critic:
  - policy
clip_actions: null
check_for_nan: true
save_interval: 1000
experiment_name: dobot_x1_symm_flat
run_name: no_trs
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
class_name: OnPolicyRunner
actor:
  class_name: MLPModel
  hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: false
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 1.0
    std_type: scalar
critic:
  class_name: MLPModel
  hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: false
  distribution_cfg: null
algorithm:
  class_name: isaaclab_tasks.manager_based.locomotion.velocity.config.go2_symm.legacy_trs_ppo:LegacyTimeReversalPPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.01
  desired_kl: 0.01
  max_grad_norm: 1.0
  optimizer: adam
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  share_cnn_encoders: false
  rnd_cfg: null
  symmetry_cfg:
    use_data_augmentation: false
    use_mirror_loss: false
    data_augmentation_func: isaaclab_tasks.manager_based.locomotion.velocity.mdp.go2_symm:compute_time_reversal_states
    mirror_loss_coeff: 0.0
    use_legacy_time_reversal_regularization: false
    value_loss_coeff: 0.0
    min_abs_command_velocity: 0.2
    warmup_iterations: 500
    command_observation_index: 3
    command_observation_scale: 2.0
policy: {}
